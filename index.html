<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Card Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene">
      <article class="hover-card" aria-label="Produkt Highlight">
        <div class="glow"></div>
        <div class="card-content">
          <p class="eyebrow">Neu</p>
          <h1>Neon Access Pass</h1>
          <p class="description">
            Entdecke die Zukunft der Events: personalisierte Zugänge, holografische
            Visuals und KI-gestützte Empfehlungen in einer Card.
          </p>
          <ul class="card-meta" aria-label="Highlights">
            <li>
              <span class="label">Verfügbarkeit</span>
              <strong>Ab sofort</strong>
            </li>
            <li>
              <span class="label">Preis</span>
              <strong>129 €</strong>
            </li>
          </ul>
          <button class="primary">Jetzt sichern</button>
        </div>
      </article>
    </main>
    <script src="script.js"></script>
  </body>
</html>
